# KIDS-CODE-LAB: offline MakeCode Arcade build + checks (docs/BUILD.md).
# GitHub-hosted runners only (public repo), no secrets. Action versions pinned by commit SHA.
name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      WORK: ${{ github.workspace }}/.build
      PKG: ${{ github.workspace }}/.build/slim
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # git describe for the version

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm

      - name: Install test tools
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Build (pinned pxt-arcade, patches, slim, precompression, tarball)
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_TYPE" = "tag" ]; then export VERSION="$REF_NAME"; else export VERSION="$(git rev-parse --short HEAD)"; fi
          bash makecode/build.sh 2>&1 | tee build.log
          ls -la "$WORK"/kids-code-lab-*.tar.gz

      - name: The build used no makecode.com cloud compiler
        run: |
          if grep -q "polling C++ build" build.log; then
            echo "::error::the build called the makecode.com cloud compiler (hardware variants back?)"; exit 1
          fi

      - name: Check - editor offline, no service worker, no console errors (no CSP header, SW allowed)
        run: SW=allow npx playwright test tests/e2e/editor.spec.mjs

      - name: Check - editor + play page with the recommended CSPs and the games-hub headers
        run: |
          CSP=editor EDITOR_TIGHT=1 HUB_HEADERS=1 npx playwright test tests/e2e/editor.spec.mjs
          CSP=play HUB_HEADERS=1 npx playwright test tests/e2e/play.spec.mjs

      - name: Check - the hub-like CSP everywhere must block the game (proves the simulator CSP is needed)
        run: |
          if CSP=strict npx playwright test tests/e2e/play.spec.mjs --grep desktop; then
            echo "::error::strict CSP unexpectedly passed"; exit 1
          fi

      - name: Upload release artefact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kids-code-lab
          path: ${{ github.workspace }}/.build/kids-code-lab-*.tar.gz
          if-no-files-found: error
          retention-days: 30

      - name: Upload check results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: check-results
          path: |
            test-results/*.json
            build.log
            ${{ github.workspace }}/.build/locs-el.tsv
          if-no-files-found: ignore
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: kids-code-lab
          path: dist

      - name: Attach the tarball to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          ls -la dist
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/kids-code-lab-*.tar.gz --clobber
          else
            gh release create "$TAG" dist/kids-code-lab-*.tar.gz --verify-tag --title "$TAG" \
              --notes "Offline MakeCode Arcade build for the kids' code lab. See docs/BUILD.md."
          fi
