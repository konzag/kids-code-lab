# KIDS-CODE-LAB: offline MakeCode Arcade build + checks (docs/BUILD.md).
# GitHub-hosted runners only (public repo), no secrets. Action versions pinned by commit SHA.
name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Build folder outside the workspace (upload-artifact skips hidden folders such as .build/)
        run: |
          echo "WORK=$RUNNER_TEMP/kcl-build" >> "$GITHUB_ENV"
          echo "PKG=$RUNNER_TEMP/kcl-build/slim" >> "$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # git describe for the version

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm

      - name: Install test tools
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Unit tests (lab settings, milestones, publish payload, gzip cap, CSP texts of ADR-0006)
        run: node --test tests/unit/core.test.mjs tests/unit/csp.test.mjs

      - name: Build (pinned pxt-arcade, patches, slim, precompression, tarball)
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          # release contract: <version> = the tag without its leading v; branch builds get 0.0.0-dev.<sha>
          if [ "$REF_TYPE" = "tag" ]; then VERSION="${REF_NAME#v}"; else VERSION="0.0.0-dev.$(git rev-parse --short HEAD)"; fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          export VERSION
          bash makecode/build.sh 2>&1 | tee build.log
          ls -la "$WORK"/kids-code-lab-*.tar.gz*

      - name: Check - release tarball layout, .sha256 and kcl-headers.json (APP-REPLY 2026-11-03 §2c)
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_TYPE" = "tag" ]; then export KCL_VERSION="$REF_NAME"; fi
          KCL_TARBALL="$WORK/kids-code-lab-$VERSION.tar.gz" node --test tests/release/release.test.mjs
          (cd "$WORK" && sha256sum -c "kids-code-lab-$VERSION.tar.gz.sha256")

      - name: The build used no makecode.com cloud compiler
        run: |
          if grep -q "polling C++ build" build.log; then
            echo "::error::the build called the makecode.com cloud compiler (hardware variants back?)"; exit 1
          fi

      - name: Check - editor offline, no service worker, no console errors (no CSP header)
        run: npx playwright test tests/e2e/editor.spec.mjs

      - name: Check - everything under the games-hub ADR-0006 CSPs and headers (editor, player, lab pages + fake hub API)
        run: CSP=adr HUB_HEADERS=1 npx playwright test

      - name: Check - the hub-like CSP everywhere must block the game (proves the simulator CSP is needed)
        run: |
          if CSP=strict npx playwright test tests/e2e/play.spec.mjs --grep desktop; then
            echo "::error::strict CSP unexpectedly passed"; exit 1
          fi

      - name: Upload release artefact (tarball + .sha256)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kids-code-lab
          path: |
            ${{ runner.temp }}/kcl-build/kids-code-lab-*.tar.gz
            ${{ runner.temp }}/kcl-build/kids-code-lab-*.tar.gz.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Upload check results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: check-results
          path: |
            test-results/*.json
            build.log
            ${{ runner.temp }}/kcl-build/locs-el.tsv
          if-no-files-found: ignore
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: kids-code-lab
          path: dist

      - name: Verify the assets before publishing
        env:
          TAG: ${{ github.ref_name }}
        run: |
          V="${TAG#v}"
          ls -la dist
          test -f "dist/kids-code-lab-$V.tar.gz" && test -f "dist/kids-code-lab-$V.tar.gz.sha256"
          (cd dist && sha256sum -c "kids-code-lab-$V.tar.gz.sha256")

      - name: Attach both assets to the GitHub release (a -rc. tag is a pre-release)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          V="${TAG#v}"
          ASSETS=("dist/kids-code-lab-$V.tar.gz" "dist/kids-code-lab-$V.tar.gz.sha256")
          PRE=()
          case "$TAG" in *-rc.*) PRE=(--prerelease) ;; esac
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
            if [ ${#PRE[@]} -gt 0 ]; then gh release edit "$TAG" --prerelease; fi
          else
            gh release create "$TAG" "${ASSETS[@]}" --verify-tag "${PRE[@]}" --title "kids-code-lab $V" \
              --notes "Offline MakeCode Arcade build for the kids' code lab (L1-27). Assets per the release contract: www/ + kcl-headers.json in one top directory, sha256sum file. See docs/BUILD.md."
          fi
          gh release view "$TAG" --json isPrerelease,assets --jq '{isPrerelease, assets: [.assets[].name]}'
